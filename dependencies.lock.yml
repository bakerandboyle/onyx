# OnYX Dependency Lock File
# Generated: 2026-02
# Purpose: Reproducible builds with exact tested versions

dependencies:
  # NVIDIA CUDA Toolkit
  cuda_toolkit:
    version: "12.3.1"
    minimum: "11.0"
    download: "https://developer.nvidia.com/cuda-12-3-1-download-archive"
    components:
      - cudart
      - cufft
      - nvcc
    compute_capability_minimum: "5.0"
    compute_capability_recommended: "7.0"

  # OpenFX SDK
  openfx:
    version: "1.4"
    repository: "https://github.com/AcademySoftwareFoundation/openfx"
    git_ref: "OFX_Release_1_4_TAG"
    license: "BSD-3-Clause"
    
  # GoogleTest (testing only - not distributed)
  googletest:
    version: "1.14.0"
    repository: "https://github.com/google/googletest"
    git_tag: "v1.14.0"
    license: "BSD-3-Clause"
    distributed: false

build_tools:
  cmake:
    minimum: "3.18"
    recommended: "3.28"
    tested: "3.28.1"
    
  compilers:
    gcc:
      minimum: "9.0"
      tested: "13.2.0"
      standard: "c++17"
      
    clang:
      minimum: "10.0"
      tested: "17.0.6"
      standard: "c++17"
      
    msvc:
      minimum: "19.29"  # VS 2019 16.10+
      tested: "19.38"   # VS 2022 17.8
      standard: "c++17"

  analysis:
    clang_format:
      version: "17.0"
    clang_tidy:
      version: "17.0"
    cppcheck:
      version: "2.13"

platforms:
  linux:
    tested:
      - distribution: "Ubuntu"
        version: "22.04 LTS"
        kernel: "5.15"
      - distribution: "Ubuntu"
        version: "24.04 LTS"
        kernel: "6.5"
    cuda_driver_minimum: "525.60"
    
  windows:
    tested:
      - version: "Windows 10"
        build: "22H2"
      - version: "Windows 11"
        build: "23H2"
    cuda_driver_minimum: "527.41"
    
  macos:
    tested:
      - version: "macOS 13 Ventura"
        arch: "x86_64"
        note: "Intel only - Apple Silicon not supported"
      - version: "macOS 14 Sonoma"
        arch: "x86_64"
        note: "Intel only - Apple Silicon not supported"
    cuda_support: "deprecated"
    status: "limited_support"

host_applications:
  davinci_resolve:
    minimum: "17.0"
    tested:
      - "17.4.6"
      - "18.0.4"
      - "18.5.1"
      - "18.6.6"
      - "19.0.0"
    editions:
      - "Free"
      - "Studio"
    ofx_version: "1.4"

# File integrity (update when versions change)
checksums:
  coding_standards_md: "sha256:pending"
  dependencies_md: "sha256:pending"
